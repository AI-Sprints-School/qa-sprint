name: review-tests

# Бонусный прогон урока 7. Подставляет вместо рабочего «Кошелька»
# заведомо сломанный lesson07/wallet_broken.py (в нём применены поломки
# П1, П2 и П3) и прогоняет по нему те же шесть тестов, которые вы
# разбираете глазами.
#
# Запускается только кнопкой: вкладка Actions → workflow review-tests →
# Run workflow. Красный прогон здесь — ожидаемый результат, а не авария:
# часть тестов обязана упасть на сломанном продукте, а часть — нет.
on:
  workflow_dispatch:

jobs:
  review:
    name: шесть тестов на сломанном «Кошельке»
    runs-on: ubuntu-latest

    steps:
      - name: Забрать репозиторий
        uses: actions/checkout@v7

      - name: Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Установка окружения
        run: |
          python --version
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Подставить сломанный «Кошелёк»
        run: cp lesson07/wallet_broken.py lesson08/wallet.py

      - name: Шесть тестов урока 7
        env:
          PYTHONPATH: lesson08
        run: python -m pytest lesson07/tests_to_review.py -v

      - name: Как читать этот прогон
        if: always()
        run: |
          echo "Красные тесты — те, что заметили поломки П1, П2 и П3."
          echo "Зелёные — те, что их не заметили. Сверьте это со своей матрицей."
